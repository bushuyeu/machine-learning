<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="ui-serif, Georgia, serif">
  <rect width="900" height="450" fill="#FDFEFE"/>

  <!-- =========================================================== -->
  <!-- LEFT PANEL: remove a non-support-vector                       -->
  <!-- =========================================================== -->
  <text x="220" y="30" font-size="16" font-weight="bold" fill="#27AE60" text-anchor="middle">Case 1: remove a non-support-vector</text>
  <text x="220" y="48" font-size="12" fill="#7F8C8D" text-anchor="middle">boundary is unchanged  →  held-out point still classified correctly</text>

  <!-- Decision boundary -->
  <line x1="60" y1="320" x2="380" y2="120" stroke="#2C3E50" stroke-width="2.8"/>
  <!-- Margin lines -->
  <line x1="48" y1="290" x2="368" y2="90" stroke="#27AE60" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.7"/>
  <line x1="72" y1="350" x2="392" y2="150" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.7"/>

  <!-- Support vectors (stay) -->
  <circle cx="150" cy="215" r="8" fill="#D5F5E3" stroke="#27AE60" stroke-width="3"/>
  <circle cx="260" cy="155" r="8" fill="#D5F5E3" stroke="#27AE60" stroke-width="3"/>
  <circle cx="210" cy="285" r="8" fill="#FADBD8" stroke="#C0392B" stroke-width="3"/>
  <circle cx="310" cy="230" r="8" fill="#FADBD8" stroke="#C0392B" stroke-width="3"/>

  <!-- Other non-SV training points, faded -->
  <circle cx="110" cy="110" r="5" fill="#27AE60" opacity="0.55"/>
  <circle cx="330" cy="70"  r="5" fill="#27AE60" opacity="0.55"/>
  <circle cx="140" cy="380" r="5" fill="#C0392B" opacity="0.55"/>
  <circle cx="355" cy="320" r="5" fill="#C0392B" opacity="0.55"/>

  <!-- The held-out non-SV (dashed outline = removed from training) -->
  <circle cx="220" cy="75" r="9" fill="none" stroke="#27AE60" stroke-width="2.5" stroke-dasharray="3,3"/>
  <text x="235" y="72" font-size="11" fill="#27AE60" font-weight="bold">xᵢ  (held out)</text>
  <text x="235" y="86" font-size="10" fill="#7F8C8D">not a support vector</text>

  <!-- Arrow: still correct -->
  <text x="220" y="410" font-size="12" fill="#27AE60" text-anchor="middle" font-style="italic" font-weight="bold">classifier Mᵢ  =  original SVC</text>
  <text x="220" y="426" font-size="11" fill="#27AE60" text-anchor="middle">prediction on xᵢ  =  correct  ✓</text>

  <!-- =========================================================== -->
  <!-- RIGHT PANEL: remove a support vector                          -->
  <!-- =========================================================== -->
  <text x="680" y="30" font-size="16" font-weight="bold" fill="#C0392B" text-anchor="middle">Case 2: remove a support vector</text>
  <text x="680" y="48" font-size="12" fill="#7F8C8D" text-anchor="middle">boundary can shift  →  held-out point may end up on the wrong side</text>

  <!-- Original decision boundary (faint, for reference) -->
  <line x1="520" y1="320" x2="840" y2="120" stroke="#2C3E50" stroke-width="1.5" opacity="0.25"/>

  <!-- New decision boundary after removing the SV (shifted) -->
  <line x1="520" y1="338" x2="850" y2="160" stroke="#2C3E50" stroke-width="2.8" stroke-dasharray="9,4"/>

  <!-- New margin lines (approximate) -->
  <line x1="512" y1="310" x2="842" y2="132" stroke="#27AE60" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.6"/>
  <line x1="528" y1="366" x2="858" y2="188" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.6"/>

  <!-- Remaining support vectors -->
  <circle cx="610" cy="230" r="8" fill="#D5F5E3" stroke="#27AE60" stroke-width="3"/>
  <circle cx="720" cy="170" r="8" fill="#D5F5E3" stroke="#27AE60" stroke-width="3"/>
  <circle cx="670" cy="310" r="8" fill="#FADBD8" stroke="#C0392B" stroke-width="3"/>
  <circle cx="775" cy="250" r="8" fill="#FADBD8" stroke="#C0392B" stroke-width="3"/>

  <!-- Non-SV points -->
  <circle cx="570" cy="110" r="5" fill="#27AE60" opacity="0.55"/>
  <circle cx="790" cy="80" r="5" fill="#27AE60" opacity="0.55"/>
  <circle cx="600" cy="390" r="5" fill="#C0392B" opacity="0.55"/>
  <circle cx="815" cy="340" r="5" fill="#C0392B" opacity="0.55"/>

  <!-- The held-out SV: was originally on the margin with class +, but new boundary passes through it -->
  <circle cx="665" cy="255" r="9" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="3,3"/>
  <text x="680" y="252" font-size="11" fill="#C0392B" font-weight="bold">xᵢ  (held out)</text>
  <text x="680" y="266" font-size="10" fill="#7F8C8D">was a support vector</text>

  <!-- Label: may flip -->
  <text x="680" y="410" font-size="12" fill="#C0392B" text-anchor="middle" font-style="italic" font-weight="bold">classifier Mᵢ  ≠  original SVC</text>
  <text x="680" y="426" font-size="11" fill="#C0392B" text-anchor="middle">prediction on xᵢ  might be wrong  ✗</text>
</svg>
